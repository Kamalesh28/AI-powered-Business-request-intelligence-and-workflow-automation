[project]
name = "business-request-intelligence"
version = "0.1.0"
description = "Local, auditable business request intelligence and automation demo using synthetic data."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "plotly>=5.24,<7.0",
    "streamlit>=1.39,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

